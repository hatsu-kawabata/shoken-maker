<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商圏メーカー — 地図に円を描くと人口がわかる</title>
<meta name="description" content="地図をクリックして円を描くだけで、商圏内の人口・世帯数・年齢構成・人口ピラミッドがその場でわかる無料ツール。登録不要。2020年国勢調査500mメッシュ対応・全国版。">
<meta property="og:title" content="商圏メーカー — 地図に円を描くと人口がわかる">
<meta property="og:description" content="出店検討・チラシ配布圏に。円を描くだけで商圏人口・年齢構成・人口ピラミッドが出る無料ツール（登録不要・全国対応）">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shoken-maker.vercel.app/">
<meta property="og:image" content="https://shoken-maker.vercel.app/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>商圏メーカー <span class="beta">β</span></h1>
  <div class="search" role="search">
    <input type="search" id="addr" placeholder="住所で移動（例: 新宿区西新宿1丁目）" autocomplete="off">
    <ul id="addrList" class="addr-list" hidden></ul>
  </div>
  <p class="tagline">地図をクリック → 円の中の人口・年齢構成がその場でわかる（2020年国勢調査 500mメッシュ）</p>
</header>
<main class="layout">
  <div id="map" aria-label="地図"></div>
  <aside class="panel viz-root">
    <div class="control">
      <label for="radius">半径 <output id="radiusOut">1.0 km</output></label>
      <input type="range" id="radius" min="300" max="5000" step="100" value="1000">
    </div>
    <div id="status" class="status">地図をクリックして中心を指定してください</div>
    <div id="results" hidden>
      <div class="tiles">
        <div class="tile hero">
          <div class="tile-label">圏内人口</div>
          <div class="tile-value" id="pop">–</div>
        </div>
        <div class="tile">
          <div class="tile-label">世帯数</div>
          <div class="tile-value sm" id="hh">–</div>
        </div>
        <div class="tile">
          <div class="tile-label">男 / 女</div>
          <div class="tile-value sm" id="mf">–</div>
        </div>
        <div class="tile">
          <div class="tile-label">平均年齢</div>
          <div class="tile-value sm" id="meanAge">–</div>
        </div>
      </div>
      <h2>年齢3区分</h2>
      <div id="ageBars" class="bars"></div>
      <h2>人口ピラミッド（5歳階級）
        <span class="legend"><span class="chip male"></span>男 <span class="chip female"></span>女</span>
      </h2>
      <div id="pyramid" class="pyramid"></div>
      <p class="note" id="maskNote" hidden></p>
      <p class="note warn" id="missingNote" hidden></p>
      <p class="meta" id="meta"></p>
    </div>
    <footer class="src">
      出典: 総務省統計局「令和2年国勢調査」500mメッシュ統計（e-Stat 統計GIS）を加工して作成。
      秘匿・合算処理のため境界付近は概算値。
    </footer>
  </aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
<script>
// Vercel Web Analytics(本番ホストのみ。ダッシュボードで有効化するまでは何もしない)
if (/\.vercel\.app$/.test(location.hostname)) {
  const s = document.createElement("script");
  s.defer = true;
  s.src = "/_vercel/insights/script.js";
  document.head.appendChild(s);
}
</script>
</body>
</html>
